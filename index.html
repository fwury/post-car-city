<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Post-car city</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="map" tabindex="0" aria-label="City map. Drag to pan, scroll or pinch to zoom, arrow keys to pan, plus and minus to zoom."></canvas>

  <details class="panel" id="panel" open>
    <summary>
      <span class="title">Post-car city</span>
      <span class="stage">Stage 5: buildings</span>
    </summary>

    <form id="seed-form" class="seed">
      <label for="seed">Seed</label>
      <div class="seed-row">
        <input id="seed" name="seed" autocomplete="off" spellcheck="false">
        <button type="submit">Apply</button>
      </div>
      <button type="button" id="new-seed" class="secondary">New seed</button>
      <label for="population" class="spaced">Population</label>
      <select id="population">
        <option value="150000">150 000 (1 district)</option>
        <option value="300000">300 000</option>
        <option value="750000">750 000</option>
        <option value="1500000">1.5 million</option>
        <option value="3000000">3 million</option>
        <option value="6000000">6 million</option>
        <option value="10000000">10 million</option>
      </select>
      <p class="site" id="site" aria-live="polite"></p>
    </form>

    <fieldset class="layers">
      <legend>Map</legend>
      <label><input type="checkbox" data-layer="neighbourhoods"><span class="swatch" style="--c: var(--hood)"></span> Neighbourhoods</label>
      <label><input type="checkbox" data-layer="cores"><span class="swatch" style="--c: var(--core)"></span> District cores</label>
      <label><input type="checkbox" data-layer="green"><span class="swatch" style="--c: var(--natural)"></span> Greenways and parks</label>
      <label><input type="checkbox" data-layer="streets"><span class="swatch" style="--c: var(--road)"></span> Boulevards and main streets</label>
      <label><input type="checkbox" data-layer="blocks"><span class="swatch" style="--c: var(--building)"></span> Blocks and local streets</label>
      <label><input type="checkbox" data-layer="transit"><span class="swatch round" style="--c: var(--rail)"></span> Transit: rail and metro</label>
    </fieldset>

    <fieldset class="layers buildings">
      <legend>Buildings</legend>
      <div class="segmented" role="radiogroup" aria-label="Building heights">
        <label><input type="radio" name="heights" value="2d" data-choice="heights"><span>2D</span></label>
        <label><input type="radio" name="heights" value="3d" data-choice="heights"><span>3D</span></label>
      </div>
      <label><input type="checkbox" data-layer="materials"> Roofs and materials</label>
    </fieldset>

    <details class="debug">
      <summary>Debug layers</summary>
      <fieldset class="layers">
        <label><input type="checkbox" data-layer="outlines"> District outlines</label>
        <label><input type="checkbox" data-layer="noise"> Noise preview</label>
        <label><input type="checkbox" data-layer="grid"> World grid</label>
        <label><input type="checkbox" data-layer="tiles"> Tile outlines</label>
        <label><input type="checkbox" data-layer="hud"> Readout</label>
      </fieldset>
    </details>

    <p class="help">Drag to pan, scroll or pinch to zoom, double-click to zoom in. Arrow keys or WASD pan (hold Shift for faster), + and − zoom.</p>
  </details>

  <div class="zoom" role="group" aria-label="Zoom">
    <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
    <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
  </div>

  <dl class="hud" id="hud" aria-live="off"></dl>

  <section class="card" id="place-card" aria-live="polite" hidden></section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
